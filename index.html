<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORBIT-X // Space Mission Control</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@500;700&display=swap');

        :root {
            --bg-color: #030712;
            --panel-bg: #0b0f19;
            --accent-cyan: #00f0ff;
            --accent-green: #00ff66;
            --accent-red: #ff3366;
            --text-main: #c9d1d9;
            --border-glow: rgba(0, 240, 255, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Efect CRT Scanlines */
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 999;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
        }

        .mission-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--panel-bg);
            border: 1px solid var(--accent-cyan);
            box-shadow: 0 0 25px var(--border-glow);
            border-radius: 8px;
            padding: 20px;
        }

        .hud-header {
            width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px dashed rgba(0, 240, 255, 0.3);
            padding-bottom: 8px;
        }

        .hud-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            color: var(--accent-cyan);
            letter-spacing: 2px;
        }

        .hud-stats {
            display: flex;
            gap: 20px;
            font-size: 14px;
            color: var(--accent-green);
        }

        .canvas-wrapper {
            position: relative;
            border: 1px solid #1f2937;
            background: #000;
            border-radius: 4px;
            overflow: hidden;
        }

        canvas {
            display: block;
            background: #000;
        }

        .hud-footer {
            width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            font-size: 12px;
            color: #6b7280;
        }

        .controls-hint span {
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 240, 255, 0.2);
            padding: 2px 6px;
            border-radius: 3px;
            background: rgba(0, 240, 255, 0.05);
        }
    </style>
</head>
<body>

    <div class="mission-container">
        <!-- NASA HUD Header -->
        <div class="hud-header">
            <div class="hud-title">🚀 ORBIT-X // ARCADE FLIGHT DECK</div>
            <div class="hud-stats">
                <span>SCORE: <strong id="scoreVal">0</strong></span>
                <span>LIVES: <strong id="livesVal">3</strong></span>
            </div>
        </div>

        <!-- Jocul Canvas -->
        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="800" height="500"></canvas>
        </div>

        <!-- Footer / Controls -->
        <div class="hud-footer">
            <div class="controls-hint">MOVE: [ <span>A</span> / <span>D</span> ] | SHOOT: [ <span>SPACE</span> ] | RESTART: [ <span>R</span> ]</div>
            <div style="color: var(--accent-green);">● STATUS: ACTIVE COMBAT</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const scoreEl = document.getElementById('scoreVal');
        const livesEl = document.getElementById('livesVal');

        let score = 0;
        let lives = 3;
        let gameOver = false;

        // Jucătorul (Nava)
        let player = {
            x: canvas.width / 2 - 20,
            y: canvas.height - 60,
            width: 40,
            height: 30,
            speed: 7,
            dx: 0
        };

        let bullets = [];
        let meteors = [];
        let keys = {};

        // Ascultăm tastele
        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'Space' && !gameOver) {
                bullets.push({
                    x: player.x + player.width / 2 - 2,
                    y: player.y,
                    width: 4,
                    height: 12,
                    speed: 10
                });
            }
            if (e.code === 'KeyR' && gameOver) {
                resetGame();
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        function resetGame() {
            score = 0;
            lives = 3;
            gameOver = false;
            bullets = [];
            meteors = [];
            player.x = canvas.width / 2 - 20;
            loop();
        }

        // Generare meteoriți periodici
        setInterval(() => {
            if (!gameOver) {
                let size = Math.random() * 25 + 15;
                meteors.push({
                    x: Math.random() * (canvas.width - size),
                    y: -size,
                    size: size,
                    speed: Math.random() * 2.5 + 1.5
                });
            }
        }, 900);

        function update() {
            if (gameOver) return;

            // Mișcare jucător
            if ((keys['ArrowLeft'] || keys['KeyA']) && player.x > 0) {
                player.x -= player.speed;
            }
            if ((keys['ArrowRight'] || keys['KeyD']) && player.x < canvas.width - player.width) {
                player.x += player.speed;
            }

            // Actualizare gloanțe
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= bullets[i].speed;
                if (bullets[i].y < 0) {
                    bullets.splice(i, 1);
                }
            }

            // Actualizare meteoriți
            for (let i = meteors.length - 1; i >= 0; i--) {
                meteors[i].y += meteors[i].speed;

                // Coliziune meteorit - jucător
                if (
                    player.x < meteors[i].x + meteors[i].size &&
                    player.x + player.width > meteors[i].x &&
                    player.y < meteors[i].y + meteors[i].size &&
                    player.y + player.height > meteors[i].y
                ) {
                    meteors.splice(i, 1);
                    lives--;
                    if (lives <= 0) {
                        gameOver = true;
                    }
                    continue;
                }

                // Coliziune glonț - meteorit
                for (let j = bullets.length - 1; j >= 0; j--) {
                    if (
                        bullets[j].x < meteors[i].x + meteors[i].size &&
                        bullets[j].x + bullets[j].width > meteors[i].x &&
                        bullets[j].y < meteors[i].y + meteors[i].size &&
                        bullets[j].y + bullets[j].height > meteors[i].y
                    ) {
                        meteors.splice(i, 1);
                        bullets.splice(j, 1);
                        score += 10;
                        break;
                    }
                }

                // Dacă meteoritul a căzut sub ecran
                if (meteors[i] && meteors[i].y > canvas.height) {
                    meteors.splice(i, 1);
                }
            }

            scoreEl.innerText = score;
            livesEl.innerText = lives;
        }

        function draw() {
            ctx.fillStyle = '#05070b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Desenăm stele statice de fundal
            ctx.fillStyle = '#ffffff33';
            ctx.fillRect(100, 150, 2, 2);
            ctx.fillRect(300, 80, 2, 2);
            ctx.fillRect(600, 200, 3, 3);
            ctx.fillRect(700, 400, 2, 2);
            ctx.fillRect(200, 450, 2, 2);

            // Desenăm nava jucătorului (Stil Neo-Cian)
            ctx.fillStyle = '#00f0ff';
            ctx.beginPath();
            ctx.moveTo(player.x + player.width / 2, player.y);
            ctx.lineTo(player.x, player.y + player.height);
            ctx.lineTo(player.x + player.width, player.y + player.height);
            ctx.closePath();
            ctx.fill();

            // Desenăm gloanțele
            ctx.fillStyle = '#00ff66';
            for (let b of bullets) {
                ctx.fillRect(b.x, b.y, b.width, b.height);
            }

            // Desenăm meteoriții
            ctx.fillStyle = '#ff3366';
            for (let m of meteors) {
                ctx.fillRect(m.x, m.y, m.size, m.size);
            }

            // Ecran Game Over
            if (gameOver) {
                ctx.fillStyle = 'rgba(3, 7, 18, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#ff3366';
                ctx.font = 'bold 32px Orbitron, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('MISSION FAILED', canvas.width / 2, canvas.height / 2 - 20);

                ctx.fillStyle = '#c9d1d9';
                ctx.font = '16px "Share Tech Mono", monospace';
                ctx.fillText(`FINAL SCORE: ${score}`, canvas.width / 2, canvas.height / 2 + 20);
                ctx.fillText('PRESS [ R ] TO RESTART MISSION', canvas.width / 2, canvas.height / 2 + 60);
            }
        }

        function loop() {
            update();
            draw();
            if (!gameOver) {
                requestAnimationFrame(loop);
            }
        }

        loop();
    </script>
</body>
</html>
